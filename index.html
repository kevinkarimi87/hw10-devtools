<!DOCTYPE html>
<html>

  <head>

    <title>Raise Your Spheal</title>
    <meta name="description" content="A virtual pet game where you raise a Spheal">
    <!-- <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon"> -->
    <link rel="icon" href="images/Spheal.png" type="image/png">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

  </head>

  <body>

    <header>
      <h1>
        Raise Your Spheal!
      </h1>
    </header>

    <main>

      <section class="pet-image-container">
         <!-- Pet image and speech area -->
        <p class="pet-comment">"Spheal!"</p>
        <img class="pet-image" src="images/Spheal.png">
      </section>

      <section class="dashboard">

        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Stage: <strong><span class="stage"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> flipper claps (per min)</strong></div>
        <div>Energy: <strong><span class="energy"></span> / 100 </strong></div>
        
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <button class="rest-button">
            Rest
          </button>
        </div>
        <button class="reset-button">
          Start Over
        </button>

        <!-- buttons that trigger browser errors for the DevTools demo -->
        <div class="debug-container">
          <button class="debug-404-button">Trigger 404</button>
          <button class="debug-typeerror-button">Trigger TypeError</button>
          <button class="debug-violation-button">Trigger Violation</button>
        </div>

      </section>

    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>

  </body>
</html>
